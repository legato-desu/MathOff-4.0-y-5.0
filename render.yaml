databases:
  - name: mathoff-db
    databaseName: mathoff
    user: mathoff
    plan: free

services:
  - type: web
    name: mathoff-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: mathoff-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: mathoff-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://mathoff-web.onrender.com,https://legato-desu.github.io
  - type: web
    name: mathoff-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://mathoff-api.onrender.com/api
